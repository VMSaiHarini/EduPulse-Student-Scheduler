version: '3.8'
services:
  app:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend/db:/app/db
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=change-this-in-production
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - ~/.n8n:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - GENERIC_TIMEZONE=Asia/Kolkata
    restart: unless-stopped
